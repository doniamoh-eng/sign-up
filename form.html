<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./form.css">
</head>
<body>
    <div class="form">
        <img src="./img/451822603_460866736804638_7871847402562263392_n.jpg" alt="this is landscape" class="img">
        <form id="myForm">
            <h2>Create an account</h2>
            <div class="firstname">
                <label for="firstName">First Name </label>
                <input type="text" id="firstName" name="firstName" class="input-firstname" oninput="submitButton()" required>
                <p id="firstNameError" class="error"></p>
            </div>
            
            <div class="lastname">
                <label for="lastName">Last Name </label>
                <input type="text" id="lastName" name="lastName" class="input-lastname"  oninput="submitButton()" required>
                <p id="lastNameError" class="error"></p>
            </div>
            
            <div class="email">
                <label for="email" class="email-label">Email </label>
                <input type="email" id="email" name="email" class="input-email"  oninput="submitButton()" required>
                <p id="emailError" class="error"></p>
            </div>
            
            <div class="phone">
                <label for="phone" class="phone-label">Phone No </label>
                <input type="text" id="phone" name="phone" class="input-phone"  oninput="submitButton()" required>
                <p id="phoneError" class="error"></p>

            </div>
            
            <div class="password">
                <label for="password" class="password-label">Password </label>
                <input type="password" id="password" name="password" class="input-password"  oninput="submitButton()"  required>
                <p id="passwordError" class="error"></p>

            </div>
           
            <div class="confirm-password">
                <label for="confirmpassword" class="confirm-password-label">Confirm</br>Password </label>
                <input type="password" id="confirmPassword"  class="input-confirm" name="confirmPassword" oninput="submitButton()" required>
                <p id="confirmPasswordError" class="error"></p>

            </div>
            
            <div class="button">
                <button type="button" onclick="validateForm()" id="submitBtn" disabled >Create an account</button>
            </div>
        </form>
    </div>
    <script src="./form.js"></script>
</body>
</html>
